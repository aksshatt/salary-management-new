# Render Blueprint: one Docker web service and a free Postgres database.
# HR_EMAIL and HR_PASSWORD are asked for when the Blueprint is created and
# never stored in git. The container prepares and seeds the database on start
# (see bin/docker-entrypoint).
services:
  - type: web
    name: salary-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: HR_EMAIL
        sync: false
      - key: HR_PASSWORD
        sync: false

databases:
  - name: salary-management-db
    plan: free
